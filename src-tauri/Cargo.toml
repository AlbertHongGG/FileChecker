[package]
name = "filechecker"
version = "0.1.0"
description = "A fast and visual directory diff and sync tool"
authors = ["JasonHong"]
edition = "2021"

[lib]
name = "filechecker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jwalk = "0.8"
tokio = { version = "1", features = ["sync", "time", "rt"] }
rayon = "1.10"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_System_IO",
]
